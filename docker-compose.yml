services:

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE:      ${DB_NAME:-uberserver}
      MARIADB_USER:          ${DB_USER:-uberserver}
      MARIADB_PASSWORD:      ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  uberserver:
    build:
      context: .
      args:
        # Get a free key at https://www.maxmind.com/en/geolite2/signup
        MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${LOBBY_PORT:-8200}:8200"       # TCP  – lobby clients connect here
      - "${NAT_PORT:-8201}:8201/udp"     # UDP  – NAT hole-punching
    environment:
      DB_HOST:     db
      DB_PORT:     3306
      DB_NAME:     ${DB_NAME:-uberserver}
      DB_USER:     ${DB_USER:-uberserver}
      DB_PASSWORD: ${DB_PASSWORD}
      LOBBY_PORT:  8200
      NAT_PORT:    8201
      # Optional. Pins the public IP advertised to external clients as the battle host
      # address. Leave unset to auto-detect on startup; set it if your WAN IP is static,
      # or if auto-detection has ever picked up a stale/incorrect value.
      ONLINE_IP:   ${ONLINE_IP:-}
      EXTRA_ARGS:  ${EXTRA_ARGS:-}
    volumes:
      # Persist logs outside the container
      - server_logs:/app/logs
      # Persist cert and config files in a data volume (never mount as a file path)
      - server_data:/app/data
      # Optional: mount custom motd / agreement files
      # - ./server_motd.txt:/app/server_motd.txt:ro
      # - ./server_agreement.txt:/app/server_agreement.txt:ro
    networks:
      - internal
    sysctls:
      - net.core.somaxconn=1024
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Optional TURN relay, for players who cannot forward a port and host through
  # a relay instead. Opt-in: nothing here starts unless you ask for the profile.
  #
  #   cp turnserver.conf.example turnserver.conf   # then edit it
  #   docker compose --profile relay up -d
  #
  # Copy the config first. Docker creates a directory in place of a missing bind
  # mount source, and coturn then starts with no configuration at all.
  #
  # The relay does not talk to the lobby and is not on the internal network. The
  # only thing tying the two together is the shared secret, which has to be the
  # same string here and on line 2 of server_turn.txt. See the README, under
  # "Relay Hosting (TURN)", including the case for running this somewhere else
  # entirely rather than on the lobby machine.
  coturn:
    profiles:
      - relay
    image: coturn/coturn:4.17.2
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf"]
    # Host networking, because coturn hands out one UDP port per allocation from
    # the min-port..max-port range in its config, and Docker expands a published
    # port range into one forwarding rule per port. Publishing coturn's default
    # 16384 port range that way is not something to do casually.
    #
    # If host networking is not available to you, drop this line, narrow
    # min-port/max-port to something you have sized, and publish that range:
    #   ports:
    #     - "3478:3478/udp"
    #     - "3478:3478/tcp"
    #     - "49152-49401:49152-49401/udp"
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      # TLS on 5349. Uncomment these with the tls-listening-port, cert and pkey
      # lines in turnserver.conf, and point them at a certificate the players'
      # clients trust. Never commit the key.
      # - ./turn_cert.pem:/etc/coturn/turn_cert.pem:ro
      # - ./turn_pkey.pem:/etc/coturn/turn_pkey.pem:ro

volumes:
  db_data:
  server_logs:
  server_data:

networks:
  internal:
    driver: bridge